[project]
name = "second-brain-agent"
version = "1.0.0"
description = "24/7 AI Second Brain Agent with Telegram interface, powered by Google Antigravity SDK"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "feedparser>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
